<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AVJ RetroPlay · Play! PS2</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100%;height:100%;object-fit:contain;outline:none;background:#000}
</style>
</head>
<body>
<canvas id="outputCanvas" tabindex="-1" width="640" height="480"></canvas>
<script>
/* Puente entre AVJ RetroPlay (index.html) y el Play! oficial (Play.js + Play.wasm).
   La página principal llama a window.AVJ_PS2.boot(file, opts, hooks). */
(function () {
  'use strict';
  const canvas = document.getElementById('outputCanvas');
  let Mod = null, fpsTimer = null, memTimer = null, lastMemSig = '', h = {};
  const log = (t, c) => { try { h.onLog && h.onLog(t, c); } catch (e) {} };
  const MAX_BYTES = 3 * 1024 * 1024 * 1024;

  function support() {
    if (location.protocol === 'file:') return 'La página está abierta como archivo local (file://).';
    if (!self.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') return 'Falta aislamiento COOP/COEP (SharedArrayBuffer). Sube el archivo _headers.';
    try { if (!document.createElement('canvas').getContext('webgl2')) return 'Tu navegador o GPU no ofrece WebGL2.'; } catch (e) { return 'WebGL2 no disponible.'; }
    return '';
  }

  // Play.js es un módulo ES (export default Play): hay que importarlo, no cargarlo como script clásico
  const PLAY_URL = new URL('Play.js', location.href).href;
  async function loadPlay() {
    try {
      const m = await import(PLAY_URL);
      if (typeof m.default !== 'function') throw new Error('Play.js no exporta una función por defecto.');
      return m.default;
    } catch (e) {
      let st = ''; try { const r = await fetch(PLAY_URL, { method: 'HEAD', cache: 'no-store' }); st = ' [HTTP ' + r.status + ']'; } catch (x) { st = ' [sin respuesta]'; }
      throw new Error('No se pudo cargar ' + PLAY_URL + st + ': ' + (e && e.message ? e.message : e));
    }
  }

  const tick = () => new Promise(r => setTimeout(r, 0));

  async function readChunks(file, onProgress) {
    const CH = 16 * 1048576, n = Math.max(1, Math.ceil(file.size / CH)), chunks = new Array(n);
    for (let i = 0; i < n; i++) {
      chunks[i] = new Uint8Array(await file.slice(i * CH, Math.min(file.size, (i + 1) * CH)).arrayBuffer());
      onProgress && onProgress((i + 1) / n, Math.min(file.size, (i + 1) * CH));
      if (i % 3 === 2) await tick();
    }
    return { chunks, CH };
  }

  // Crea un archivo virtual que lee directamente de los trozos en RAM (sin duplicar el ISO en MEMFS)
  function mountChunked(FS, path, size, chunks, CH) {
    const node = FS.create(path, 0o444);
    node.usedBytes = size;
    node.stream_ops = {
      llseek(stream, offset, whence) {
        let p = offset;
        if (whence === 1) p += stream.position; else if (whence === 2) p += size;
        if (p < 0) throw new FS.ErrnoError(28);
        return p;
      },
      read(stream, buffer, offset, length, position) {
        if (position >= size) return 0;
        const n = Math.min(length, size - position);
        const dst = new Uint8Array(buffer.buffer, buffer.byteOffset + offset, n);
        let done = 0;
        while (done < n) {
          const p = position + done, c = chunks[(p / CH) | 0], co = p % CH, take = Math.min(n - done, c.length - co);
          dst.set(c.subarray(co, co + take), done);
          done += take;
        }
        return done;
      },
      write() { throw new FS.ErrnoError(63); }
    };
    return node;
  }

  function mkdirp(FS, dir) {
    let cur = '';
    for (const part of dir.split('/').filter(Boolean)) { cur += '/' + part; try { FS.mkdir(cur); } catch (e) { /* ya existe */ } }
  }

  function collectMemcards() {
    const FS = Mod && Mod.FS, out = [];
    if (!FS) return out;
    const readDir = (dir, depth) => {
      let names; try { names = FS.readdir(dir); } catch (e) { return; }
      for (const n of names) {
        if (n === '.' || n === '..') continue;
        const p = (dir === '/' ? '' : dir) + '/' + n;
        let st; try { st = FS.stat(p); } catch (e) { continue; }
        if (FS.isDir(st.mode)) { if (depth < 4) readDir(p, depth + 1); }
        else { try { out.push({ path: p, data: new Uint8Array(FS.readFile(p)) }); } catch (e) { /* ignorar */ } }
      }
    };
    const find = (dir, depth) => {
      if (depth > 5) return;
      let names; try { names = FS.readdir(dir); } catch (e) { return; }
      for (const n of names) {
        if (n === '.' || n === '..') continue;
        const p = (dir === '/' ? '' : dir) + '/' + n;
        if (['/proc', '/dev', '/discs', '/tmp'].includes(p)) continue;
        let st; try { st = FS.stat(p); } catch (e) { continue; }
        if (!FS.isDir(st.mode)) continue;
        if (/Memorycards$/i.test(p)) readDir(p, 0); else find(p, depth + 1);
      }
    };
    find('/', 0);
    return out;
  }

  async function boot(file, opts, hooks) {
    h = hooks || {}; opts = opts || {};
    const why = support();
    if (why) throw new Error(why);
    if (file.size > MAX_BYTES) throw new Error('El archivo supera 3 GB y no cabe en la memoria del navegador. Conviértelo a .chd (chdman createdvd) para reducirlo.');

    log('Cargando motor Play! (Play.js + Play.wasm)…', 'text-avj-300');
    const Play = await loadPlay();

    let aborted = false;
    const modPromise = Play({
      canvas,
      mainScriptUrlOrBlob: PLAY_URL,                                   // los hilos (workers) se crean desde Play.js
      locateFile: (f) => new URL(f, PLAY_URL).href,                    // Play.wasm junto a Play.js
      print: (t) => log(String(t), 'text-zinc-300'),
      printErr: (t) => log(String(t), 'text-amber-300'),
      setStatus: () => {},
      onAbort: (w) => { aborted = true; log('[ABORT] ' + w, 'text-red-400'); h.onError && h.onError('El motor Play! se detuvo: ' + w); }
    });
    Mod = await Promise.race([modPromise, new Promise((_, rej) => setTimeout(() => rej(new Error('Play! no terminó de iniciar en 90 s.')), 90000))]);
    const api = Object.keys(Mod).filter(k => /boot|initVm|frames/i.test(k));
    log('Motor listo. Funciones disponibles: ' + (api.join(', ') || '(ninguna detectada)'), 'text-emerald-400');

    const FS = Mod.FS;
    if (!FS) throw new Error('Esta compilación de Play.js no expone el sistema de archivos (FS).');

    // Restaurar Memory Cards guardadas
    if (opts.memcards && opts.memcards.length) {
      let n = 0;
      for (const f of opts.memcards) { try { mkdirp(FS, f.path.replace(/\/[^/]*$/, '')); FS.writeFile(f.path, f.data); n++; } catch (e) { log('No se pudo restaurar ' + f.path + ': ' + e.message, 'text-amber-300'); } }
      log(`Memory Cards restauradas: ${n}`, 'text-emerald-400');
    }

    // Montar el disco
    try { FS.mkdir('/discs'); } catch (e) { /* ya existe */ }
    const safe = file.name.replace(/[^A-Za-z0-9._-]/g, '_');
    const path = '/discs/' + safe;
    log(`Leyendo "${file.name}" a memoria (${(file.size / 1048576).toFixed(0)} MB)…`, 'text-avj-300');
    const { chunks, CH } = await readChunks(file, h.onProgress);
    mountChunked(FS, path, file.size, chunks, CH);
    log('Disco montado en ' + path, 'text-emerald-400');

    if (typeof Mod._initVm === 'function') { log('Inicializando máquina virtual (initVm)…'); Mod._initVm(); }

    const isElf = /\.elf$/i.test(file.name);
    if (isElf) {
      if (typeof Mod.bootElf !== 'function') throw new Error('Esta compilación no expone bootElf.');
      Mod.bootElf(path);
    } else {
      if (typeof Mod.bootDiscImage !== 'function') throw new Error('Esta compilación no expone bootDiscImage.');
      Mod.bootDiscImage(path);
    }
    log('Arranque solicitado: ' + (isElf ? 'bootElf' : 'bootDiscImage'), 'text-white font-bold');
    if (aborted) return;
    h.onStart && h.onStart();
    try { window.focus(); canvas.focus(); } catch (e) {}

    if (typeof Mod.getFrames === 'function') {
      let last = null, lastT = performance.now();
      fpsTimer = setInterval(() => {
        try {
          const f = Number(Mod.getFrames()), now = performance.now();
          if (last !== null && now > lastT) h.onFps && h.onFps(Math.max(0, Math.round((f - last) * 1000 / (now - lastT))));
          last = f; lastT = now;
        } catch (e) { clearInterval(fpsTimer); }
      }, 1000);
    }
    memTimer = setInterval(() => {
      try {
        const files = collectMemcards();
        const sig = files.map(f => f.path + ':' + f.data.length + ':' + f.data.reduce((a, b, i) => (i % 997 === 0 ? (a * 31 + b) >>> 0 : a), 7)).join('|');
        if (files.length && sig !== lastMemSig) { lastMemSig = sig; h.onMemcards && h.onMemcards(files); }
      } catch (e) { /* ignorar */ }
    }, 20000);
  }

  function stop() { clearInterval(fpsTimer); clearInterval(memTimer); }

  window.AVJ_PS2 = { support, boot, stop, collectMemcards };
})();
</script>
</body>
</html>
