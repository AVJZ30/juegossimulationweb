<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVJ RetroPlay · Play! PS2</title>
<style>html,body{margin:0;width:100%;height:100%;background:#090412;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain;outline:none;background:#000}</style></head>
<body><canvas id="outputCanvas" tabindex="0" width="640" height="480" aria-label="Pantalla PS2. Haz clic para activar teclado y mando."></canvas>
<script>
/* Play! d44bfa18: disc images use Module.discImageDevice, NOT MEMFS.
   Keep Play.js and Play.wasm paired. See PS2-VERIFICACION.md. */
(() => {
  'use strict';
  const canvas = document.getElementById('outputCanvas');
  const PLAY_URL = new URL('Play.js', location.href).href;
  let Mod, hooks = {}, booted = false, stopped = false, failed = false;
  let fpsTimer, saveTimer, inputFrame, totalFrames = 0, lastSave = null;
  let saveQueue = Promise.resolve();
  const stats = { reads: 0, bytes: 0, lastPos: 0, pending: false, lastReadMs: 0 };
  const log = (s, c = 'text-zinc-300') => { console.log('[PS2]', s); hooks.onLog?.(s, c); };
  function fail(e) {
    if (failed || stopped) return;
    failed = true;
    log('[ERROR] ' + (e?.message || e), 'text-red-400');
    clearInterval(fpsTimer); clearInterval(saveTimer); cancelAnimationFrame(inputFrame);
    releaseInputs();
    // Defer iframe removal until the current proxied callback has returned.
    setTimeout(() => hooks.onError?.(String(e?.message || e)), 0);
  }
  window.addEventListener('error', e => fail(e.error || e.message));
  window.addEventListener('unhandledrejection', e => fail(e.reason));
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('Contexto WebGL perdido. Reinicia el emulador.'); });
  canvas.addEventListener('webglcontextcreationerror', e => log('[gl] ' + e.statusMessage, 'text-red-400'));
  canvas.addEventListener('pointerdown', () => canvas.focus());

  function support() {
    if (location.protocol === 'file:') return 'Usa HTTPS o localhost, no file://.';
    if (!self.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') return 'Falta aislamiento COOP/COEP. Comprueba coi-sw.js y recarga la página.';
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) return 'WebGL2 no está disponible.';
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return '';
  }

  class DiscImageDevice {
    constructor(module) { this.module = module; this.file = null; this.doneFlag = true; }
    setFile(file) { this.file = file; }
    getFileSize() { if (!this.file) throw Error('No hay disco seleccionado.'); return this.file.size; }
    isDone() { return this.doneFlag; }
    read(dstPtr, offset, size) {
      this.doneFlag = false;
      stats.pending = true;
      const started = performance.now();
      // The native stream serializes requests and polls isDone on the VM pthread.
      // Do not block the main thread with Atomics.wait or a synchronous wait loop.
      const ptr = dstPtr >>> 0, count = size >>> 0;
      if (!this.file || !Number.isSafeInteger(offset) || offset < 0 || offset + count > this.file.size) {
        this.doneFlag = true; stats.pending = false;
        fail('Lectura fuera del disco: posición ' + offset + ', tamaño ' + count + '. Archivo truncado o formato no compatible.');
        return;
      }
      this.file.slice(offset, offset + count).arrayBuffer().then(data => {
        if (stopped || failed) return;
        if (data.byteLength !== count) throw Error('Lectura incompleta del archivo local.');
        // Obtain HEAPU8 after awaiting: memory growth may have replaced the view.
        const heap = this.module.HEAPU8;
        if (ptr + count > heap.byteLength) throw Error('Destino de lectura fuera de la memoria WASM.');
        heap.set(new Uint8Array(data), ptr);
        stats.reads++; stats.bytes += count; stats.lastPos = offset;
        stats.lastReadMs = performance.now() - started;
        if (stats.reads <= 8) log(`[disco] read #${stats.reads}: offset=${offset}, bytes=${count}, ${stats.lastReadMs.toFixed(1)} ms`);
      }).catch(fail).finally(() => { stats.pending = false; this.doneFlag = true; });
    }
  }

  function mkdirp(path) {
    let dir = '';
    for (const part of path.split('/').filter(Boolean)) {
      dir += '/' + part;
      if (!Mod.FS.analyzePath(dir).exists) Mod.FS.mkdir(dir);
    }
  }
  // Discover native defaults instead of assuming a home directory for this build.
  function cardRoots() {
    const FS = Mod?.FS, roots = [];
    if (!FS) return roots;
    function walk(dir, depth) {
      if (depth > 7) return;
      for (const name of FS.readdir(dir)) {
        if (name === '.' || name === '..') continue;
        const p = (dir === '/' ? '' : dir) + '/' + name;
        if (/^\/(dev|proc|tmp)(\/|$)/.test(p)) continue;
        const node = FS.lstat(p);
        if (!FS.isDir(node.mode)) continue;
        if (/\/vfs\/mc[01]$/.test(p)) roots.push(p); else walk(p, depth + 1);
      }
    }
    walk('/', 0); return roots;
  }
  function collectMemcards() {
    const FS = Mod?.FS, files = [];
    if (!FS) return files;
    function walk(dir) {
      for (const name of FS.readdir(dir)) {
        if (name === '.' || name === '..') continue;
        const path = dir + '/' + name, st = FS.lstat(path);
        if (FS.isDir(st.mode)) walk(path);
        else if (FS.isFile(st.mode)) files.push({ path, data: new Uint8Array(FS.readFile(path)) });
      }
    }
    cardRoots().forEach(walk);
    return files.sort((a,b) => a.path.localeCompare(b.path));
  }
  function sameFiles(a, b) {
    return a && a.length === b.length && a.every((f,i) => f.path === b[i].path && f.data.length === b[i].data.length && f.data.every((v,j) => v === b[i].data[j]));
  }
  function persistCards() {
    if (!Mod || failed || !hooks.onMemcards) return saveQueue;
    const files = collectMemcards();
    if (sameFiles(lastSave, files)) return saveQueue;
    lastSave = files;
    saveQueue = saveQueue.then(() => hooks.onMemcards(files)).catch(e => {
      lastSave = null; log('[guardado] No se pudo guardar en IndexedDB: ' + e.message, 'text-amber-300');
    });
    return saveQueue;
  }

  // Native bindings in Source/ui_js/Main.cpp. This build has no analog input API;
  // gamepad axes are mapped to the official simulated-axis keys (digital values).
  const buttonCodes = ['KeyZ','KeyX','KeyA','KeyS','Key1','Key8','Key2','Key9','Backspace','Enter','Key3','Key0','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  const validCodes = new Set([...buttonCodes,'KeyF','KeyH','KeyT','KeyG','KeyJ','KeyL','KeyI','KeyK']);
  const physical = new Set(), padKeys = new Set(), delivered = new Set();
  function dispatchKey(code, down) { canvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {code, key:code, bubbles:true, cancelable:true})); }
  function reconcileInputs() {
    const next = new Set([...physical,...padKeys]);
    for (const code of delivered) if (!next.has(code)) dispatchKey(code,false);
    for (const code of next) if (!delivered.has(code)) dispatchKey(code,true);
    delivered.clear(); next.forEach(c => delivered.add(c));
  }
  function releaseInputs() { physical.clear(); padKeys.clear(); reconcileInputs(); }
  for (const type of ['keydown','keyup']) canvas.addEventListener(type, e => {
    if (!e.isTrusted) return;
    const code = e.code.replace(/^Digit([012389])$/, 'Key$1');
    if (!validCodes.has(code)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (type === 'keydown') physical.add(code); else physical.delete(code);
    reconcileInputs();
  }, true);
  canvas.addEventListener('blur',releaseInputs);
  window.addEventListener('blur',releaseInputs);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseInputs(); persistCards(); } });
  window.addEventListener('pagehide', () => { releaseInputs(); persistCards(); });
  function pollInput() {
    if (stopped || failed) return;
    padKeys.clear();
    if (!document.hidden && document.activeElement === canvas) {
      const pad = Array.from(navigator.getGamepads?.() || []).find(p => p && p.mapping === 'standard');
      if (pad) {
        buttonCodes.forEach((code,i) => { if (pad.buttons[i]?.pressed) padKeys.add(code); });
        [['KeyF','KeyH'],['KeyT','KeyG'],['KeyJ','KeyL'],['KeyI','KeyK']].forEach(([neg,pos],i) => {
          if (pad.axes[i] < -0.25) padKeys.add(neg);
          if (pad.axes[i] > 0.25) padKeys.add(pos);
        });
      }
    }
    reconcileInputs(); inputFrame = requestAnimationFrame(pollInput);
  }

  async function boot(file, opts = {}, h = {}) {
    if (booted) throw Error('Crea un iframe nuevo para reiniciar Play!.');
    hooks = h; const why = support(); if (why) throw Error(why);
    if (!file?.size) throw Error('El archivo está vacío.');
    booted = true;
    log('[versión] AVJ PS2 disc-device · Play! d44bfa18');
    log(`[entorno] isolated=${crossOriginIsolated}, CPU=${navigator.hardwareConcurrency}, disco=${file.size} bytes`);
    // Instrument only this iframe; do not patch the generated Emscripten runtime.
    const NativeWorker = window.Worker;
    window.Worker = class extends NativeWorker {
      constructor(url, options) {
        super(url, options);
        log(`[hilo] creado ${options?.name || ''} (${options?.type || 'classic'})`);
        this.addEventListener('error', e => fail('Error en pthread: ' + e.message));
        this.addEventListener('messageerror', () => fail('Mensaje de pthread no deserializable.'));
        this.addEventListener('message', e => {
          if (['loaded','alert'].includes(e.data?.cmd)) log('[hilo] ' + e.data.cmd + ' ' + (e.data.text || ''));
        });
      }
      postMessage(message, ...rest) {
        if (['load','run'].includes(message?.cmd)) log('[hilo] envío ' + message.cmd);
        return super.postMessage(message,...rest);
      }
    };
    const nativeContext = canvas.getContext.bind(canvas);
    canvas.getContext = (type, attrs) => {
      const result = nativeContext(type,attrs);
      log(`[gl] ${type}: ${result ? 'OK' : 'NULL'}`);
      return result;
    };
    const {default:Play} = await import(PLAY_URL);
    let timeout;
    try {
      Mod = await Promise.race([Play({
        canvas, mainScriptUrlOrBlob:PLAY_URL, locateFile:f => new URL(f,PLAY_URL).href,
        print:s => { log(String(s)); if (/Failed to start:|Error mounting cdrom0/i.test(s)) fail(s); },
        printErr:s => log('[motor] ' + s,'text-amber-300'), onAbort:fail
      }), new Promise((_,reject) => { timeout=setTimeout(() => reject(Error('Tiempo de inicialización agotado (90 s).')),90000); })]);
    } finally { clearTimeout(timeout); }
    if (failed || stopped) return;
    const FS = Mod.FS;
    if (!FS || !Mod._initVm || !Mod.bootDiscImage || !Mod.clearStats) throw Error('Play.js/Play.wasm no corresponden a la interfaz oficial esperada.');
    mkdirp('/work');
    Mod.discImageDevice = new DiscImageDevice(Mod);
    // Official order: await Play(), /work, disc device, initVm(), file, boot.
    log('[vm] initVm; canvas #outputCanvas 640×480, WebGL2');
    Mod._initVm();
    const roots = cardRoots();
    log('[memory cards] ' + roots.join(', '));
    for (const f of opts.memcards || []) {
      if (!roots.some(root => f.path.startsWith(root + '/')) || f.path.split('/').includes('..')) { log('[guardado] Ruta descartada: ' + f.path); continue; }
      mkdirp(f.path.slice(0,f.path.lastIndexOf('/')));
      FS.writeFile(f.path, new Uint8Array(f.data));
    }
    lastSave = collectMemcards();
    // Trace native filesystem traffic (ELF, config, cards). ISO reads use the device.
    for (const name of ['open','read','llseek']) {
      const orig = FS[name]; let calls = 0;
      FS[name] = function(...args) {
        try { const result = orig.apply(FS,args); if (calls++ < 12) log(`[fs] ${name} ${typeof args[0] === 'string' ? args[0] : args[0]?.path || ''} OK`); return result; }
        catch(e) { log(`[fs] ${name} errno=${e.errno}`); throw e; }
      };
    }
    const name = file.name.replace(/[^A-Za-z0-9._-]/g,'_');
    if (/\.elf$/i.test(name)) {
      if (file.size > 128 * 1048576) throw Error('ELF demasiado grande (máximo 128 MB).');
      const path='/work/'+name;
      FS.writeFile(path,new Uint8Array(await file.arrayBuffer()),{canOwn:true});
      Mod.bootElf(path);
    } else {
      Mod.discImageDevice.setFile(file);
      Mod.bootDiscImage(name);
      log('[disco] Archivo local conectado; lectura bajo demanda, sin precargar el ISO ni subirlo.');
    }
    hooks.onProgress?.(1,0);
    hooks.onStart?.();
    window.focus(); canvas.focus(); pollInput();
    let lastTime=performance.now(), lastFrameTime=lastTime, warned=false;
    fpsTimer=setInterval(() => {
      if (failed || stopped) return;
      const now=performance.now(), frames=Number(Mod.getFrames());
      Mod.clearStats(); // Official counter is explicitly reset, never guessed.
      totalFrames+=frames;
      if (frames) { lastFrameTime=now; warned=false; }
      hooks.onFps?.(Math.round(frames*10000/(now-lastTime))/10,{reads:stats.reads,mb:stats.bytes/1048576,frames:totalFrames});
      lastTime=now;
      if (now-lastFrameTime>20000 && !warned) {
        warned=true;
        log(`[diagnóstico] frames=${totalFrames}, reads=${stats.reads}, pending=${stats.pending}, heap=${Mod.HEAPU8.byteLength}, main heartbeat OK. Estado interno de pthreads no exportado.`,'text-amber-300');
        hooks.onStall?.({...stats,mb:stats.bytes/1048576});
      }
    },1000);
    saveTimer=setInterval(persistCards,5000);
  }
  function stop() { persistCards(); stopped=true; clearInterval(fpsTimer); clearInterval(saveTimer); cancelAnimationFrame(inputFrame); releaseInputs(); }
  window.AVJ_PS2={support,boot,stop,collectMemcards,persistCards,diagnostics:() => ({...stats,totalFrames,failed,stopped})};
})();
</script></body></html>
